[build]
  command = "npm ci && npm run build:core && npm run build -w @mnemos/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed asset filenames make these safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
